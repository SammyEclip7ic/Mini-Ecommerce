services:
  - type: pserv
    name: campus-ecommerce-db
    plan: free

  - type: web
    name: campus-ecommerce-api
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn MiniEcommerce.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-ecommerce-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
